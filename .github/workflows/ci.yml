name: CI

on:
  push:
    branches: ["**"]  # every branch, so a task branch is checked before its PR; not tags
  workflow_dispatch:

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The API image runs python:3.11-slim (Dockerfile.api).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No .env here: tests must not need FalkorDB, GitHub or an LLM.
      - name: Run pytest
        run: pytest -q

  compose:
    name: Compose config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Placeholders for the variables compose requires (:?), so only the file is checked.
      - name: Validate docker-compose.yml
        env:
          FALKORDB_PASSWORD: ci-placeholder
          API_DOMAIN: ci.example.com
        run: docker compose config --quiet
