name: CI

on:
  push:
    branches: ["**"]  # every branch, so a task branch is checked before its PR; not tags
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    name: Python lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check .
      - name: Check Python formatting
        run: ruff format --check .

  web-quality:
    name: Frontend lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Check frontend formatting
        run: npm run format:check
      - name: Typecheck frontend
        run: npm run typecheck

  pytest:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The API image runs python:3.11-slim (Dockerfile.api).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No .env here: tests must not need FalkorDB, GitHub or an LLM.
      - name: Run pytest
        run: pytest -q

  compose:
    name: Compose config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Placeholders for the variables compose requires (:?), so only the file is checked.
      - name: Validate docker-compose.yml
        env:
          FALKORDB_PASSWORD: ci-placeholder
          API_DOMAIN: ci.example.com
        run: docker compose config --quiet
